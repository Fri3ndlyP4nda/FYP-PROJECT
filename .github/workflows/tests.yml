name: tests

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The suite needs a real MongoDB: every model pins $connection = 'mongodb',
      # and the unique:users,email rule resolves against the default connection,
      # so sqlite gives them nothing to talk to.
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # mongodb is not bundled with PHP; without it every model fails to boot.
          #
          # Pinned to 1.x deliberately. composer.lock resolves mongodb/mongodb
          # 1.21.3, which requires ext-mongodb ^1.21.0 - so the 2.x that setup-php
          # would otherwise install is rejected and `composer install` fails before
          # a single test runs. Bump this together with the lockfile, not before it.
          extensions: mbstring, bcmath, curl, dom, fileinfo, mongodb-1.21.5
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        # Required, not cosmetic. layouts/app.blade.php calls @vite(...), and
        # public/build is gitignored - so without a build every test that renders
        # a page through the layout dies with "Vite manifest not found" rather
        # than failing on anything it was actually asserting.
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        # phpunit.xml already points at mongodb://127.0.0.1:27017 / apel_testing,
        # which is exactly what the service container above exposes.
        run: php artisan test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mongodb-1.21.5   # see the note in the test job
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        # --test reports violations without rewriting, so CI never pushes changes.
        run: ./vendor/bin/pint --test
